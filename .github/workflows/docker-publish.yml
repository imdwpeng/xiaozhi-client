name: Docker 发布

on:
  push:
    tags:
      - 'v*.*.*'  # 只在以 v 开头的标签推送时触发，例如 v1.0.0
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Base Image"]
    types:
      - completed

permissions:
  packages: write
  contents: write
  id-token: write
  issues: write

jobs:
  release:
    name: Release Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check Disk Space
        run: |
          df -h
          docker system df

      - name: Clean up Docker resources
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Extract version from tag or package.json
        id: get_version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "IS_VERSION=true" >> $GITHUB_ENV
          else
            # 从 package.json 获取版本号
            VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "IS_VERSION=false" >> $GITHUB_ENV
          fi
          echo "Docker 版本: ${{ env.VERSION }}"

      # 构建 xiaozhi-client 镜像
      - name: Build and push xiaozhi-client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IS_VERSION == 'true' && format('ghcr.io/{0}:v{1},ghcr.io/{0}:latest', github.repository, env.VERSION) || format('ghcr.io/{0}:latest', github.repository) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain
            XIAOZHI_VERSION=${{ env.VERSION }}

      - name: 发布总结
        run: |
          echo "🎉 Docker 镜像发布完成！"
          echo ""
          echo "📦 发布信息:"
          if [ "${{ env.IS_VERSION }}" = "true" ]; then
            echo "  版本号: v${{ env.VERSION }} (标签推送)"
          else
            echo "  版本号: latest (手动触发)"
          fi
          echo "  分支: main"
          echo "  触发方式: ${{ github.event_name }}"
          echo ""
          echo "🏷️ Docker 镜像地址:"
          if [ "${{ env.IS_VERSION }}" = "true" ]; then
            echo "  - ghcr.io/${{ github.repository }}:v${{ env.VERSION }}"
            echo "  - ghcr.io/${{ github.repository }}:latest"
          else
            echo "  - ghcr.io/${{ github.repository }}:latest"
          fi
          echo ""
          echo "🚀 使用方法:"
          echo "  # 拉取镜像"
          if [ "${{ env.IS_VERSION }}" = "true" ]; then
            echo "  docker pull ghcr.io/${{ github.repository }}:v${{ env.VERSION }}"
          fi
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "  # 运行容器"
          echo "  docker run -it -p 9999:9999 -p 3000:3000 ghcr.io/${{ github.repository }}:latest"
